name: Rust Production Readiness

on:
  push:
    branches: [main, develop]
    paths:
      - "rust_github_archiver/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "rust_github_archiver/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  DATABASE_URL: postgresql://github_archiver:test_password@localhost:5432/github_archiver_test
  REDIS_URL: redis://localhost:6379
  ENABLE_AI_TRIAGE: "false"
  COVERAGE_MIN_LINES: "70"

jobs:
  rust-gates:
    name: Rust Format, Check, Clippy, Static Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_github_archiver
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_github_archiver -> target

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Static skeleton marker scan
        run: |
          ! rg -n "todo!|unimplemented!|TODO|FIXME|Mock data|mock data|Would be calculated|Placeholder|placeholder|Temporarily disabled|Simple implementation|in reality|This would|simulate|mock" \
            src tauri-app/src \
            -g '!target' \
            -g '!node_modules'

  rust-tests:
    name: Rust Full Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: github_archiver
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: github_archiver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: rust_github_archiver
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_github_archiver -> target

      - name: Run migrations when available
        run: |
          cargo install sqlx-cli --locked --no-default-features --features postgres
          sqlx migrate run

      - name: Test all targets and features
        run: cargo test --all-targets --all-features --locked

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: rust-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: github_archiver
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: github_archiver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: rust_github_archiver
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_github_archiver -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run migrations when available
        run: |
          cargo install sqlx-cli --locked --no-default-features --features postgres
          sqlx migrate run

      - name: Generate coverage
        run: cargo llvm-cov --all-targets --all-features --locked --fail-under-lines "${COVERAGE_MIN_LINES}" --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: rust_github_archiver/lcov.info
          retention-days: 14

  tauri-ui:
    name: Tauri and Browser UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_github_archiver/tauri-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_github_archiver/tauri-app -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rust_github_archiver/tauri-app/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Build browser UI
        run: npm run build

      - name: Format Tauri Rust
        run: cargo fmt --all -- --check

      - name: Check Tauri Rust
        run: cargo check --locked

  security:
    name: Dependency and Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_github_archiver
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        # RUSTSEC-2023-0071 has no patched release; keep it explicit so new advisories still fail.
        run: cargo audit --ignore RUSTSEC-2023-0071

  production-ready:
    name: Production-Readiness Gate
    runs-on: ubuntu-latest
    needs: [rust-gates, rust-tests, coverage, tauri-ui, security]
    steps:
      - name: Report readiness
        run: echo "All production-readiness gates passed."
