name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  KUBE_NAMESPACE: github-archiver-staging

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.github-archiver.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: github-archiver
          IMAGE_TAG: staging-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:staging-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:staging-latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.27.0'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region us-east-1 --name github-archiver-staging

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          kubectl exec -n $KUBE_NAMESPACE deployment/github-archiver -- \
            /app/migrate

      - name: Update deployment
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: github-archiver
          IMAGE_TAG: staging-${{ github.sha }}
        run: |
          kubectl set image deployment/github-archiver \
            github-archiver=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -n $KUBE_NAMESPACE

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/github-archiver -n $KUBE_NAMESPACE --timeout=5m

      - name: Run smoke tests
        run: |
          STAGING_URL="https://staging.github-archiver.example.com"
          
          # Health check
          curl -f $STAGING_URL/health || exit 1
          
          # Readiness check
          curl -f $STAGING_URL/health/ready || exit 1
          
          # API check
          curl -f -H "Authorization: Bearer ${{ secrets.STAGING_API_TOKEN }}" \
            $STAGING_URL/api/v1/events?limit=1 || exit 1

      - name: Notify deployment success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "✅ Staging deployment successful",
              attachments: [{
                color: 'good',
                text: `Commit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nBranch: ${{ github.ref }}`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "❌ Staging deployment failed",
              attachments: [{
                color: 'danger',
                text: `Commit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nBranch: ${{ github.ref }}`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/github-archiver -n $KUBE_NAMESPACE
          kubectl rollout status deployment/github-archiver -n $KUBE_NAMESPACE --timeout=5m
