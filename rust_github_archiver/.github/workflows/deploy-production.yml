name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        type: string

env:
  KUBE_NAMESPACE: github-archiver-production

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github-archiver.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Verify production checklist
        run: |
          echo "Verifying production deployment checklist..."
          # Add production deployment checklist verification here
          # - Security scan passed
          # - Load tests passed
          # - Database backup completed
          # - Rollback plan documented

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: github-archiver
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:production-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:production-latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.27.0'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region us-east-1 --name github-archiver-production

      - name: Create database backup
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          kubectl exec -n $KUBE_NAMESPACE statefulset/postgres -- \
            pg_dump -U postgres github_archiver > backup-$(date +%Y%m%d-%H%M%S).sql
          
          # Upload backup to S3
          aws s3 cp backup-*.sql s3://github-archiver-backups/$(date +%Y%m%d)/

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          kubectl exec -n $KUBE_NAMESPACE deployment/github-archiver -- \
            /app/migrate

      - name: Blue-Green Deployment - Deploy to Green
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: github-archiver
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          # Create green deployment
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: github-archiver-green
            namespace: $KUBE_NAMESPACE
          spec:
            replicas: 3
            selector:
              matchLabels:
                app: github-archiver
                version: green
            template:
              metadata:
                labels:
                  app: github-archiver
                  version: green
              spec:
                containers:
                - name: github-archiver
                  image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                  # ... (same config as main deployment)
          EOF
          
          kubectl rollout status deployment/github-archiver-green -n $KUBE_NAMESPACE --timeout=5m

      - name: Run smoke tests on Green
        run: |
          GREEN_SERVICE_IP=$(kubectl get svc github-archiver-green -n $KUBE_NAMESPACE -o jsonpath='{.spec.clusterIP}')
          
          # Health check
          kubectl run smoke-test --rm -i --restart=Never --image=curlimages/curl -- \
            curl -f http://$GREEN_SERVICE_IP:8081/health || exit 1
          
          # Readiness check
          kubectl run smoke-test --rm -i --restart=Never --image=curlimages/curl -- \
            curl -f http://$GREEN_SERVICE_IP:8081/health/ready || exit 1
          
          # API check
          kubectl run smoke-test --rm -i --restart=Never --image=curlimages/curl -- \
            curl -f -H "Authorization: Bearer ${{ secrets.PRODUCTION_API_TOKEN }}" \
            http://$GREEN_SERVICE_IP:8081/api/v1/events?limit=1 || exit 1

      - name: Switch traffic to Green
        run: |
          # Update service to point to green deployment
          kubectl patch service github-archiver -n $KUBE_NAMESPACE -p '{"spec":{"selector":{"version":"green"}}}'
          
          echo "Traffic switched to green deployment"
          sleep 30

      - name: Monitor for 5 minutes
        run: |
          echo "Monitoring green deployment for 5 minutes..."
          for i in {1..10}; do
            sleep 30
            # Check error rate
            ERROR_RATE=$(kubectl exec -n $KUBE_NAMESPACE deployment/github-archiver-green -- \
              curl -s http://localhost:9090/api/v1/query?query=rate\(http_requests_total{status=~\"5..\"}[5m]\) | \
              jq -r '.data.result[0].value[1]')
            
            if (( $(echo "$ERROR_RATE > 0.05" | bc -l) )); then
              echo "Error rate too high: $ERROR_RATE"
              exit 1
            fi
            
            echo "Check $i/10: Error rate $ERROR_RATE - OK"
          done

      - name: Remove old Blue deployment
        if: success()
        run: |
          kubectl delete deployment github-archiver-blue -n $KUBE_NAMESPACE --ignore-not-found=true
          kubectl label deployment github-archiver-green version=blue -n $KUBE_NAMESPACE --overwrite

      - name: Notify deployment success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "🚀 Production deployment successful",
              attachments: [{
                color: 'good',
                text: `Version: ${{ github.event.inputs.version || github.ref }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "🔥 Production deployment failed",
              attachments: [{
                color: 'danger',
                text: `Version: ${{ github.event.inputs.version || github.ref }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back to blue deployment..."
          kubectl patch service github-archiver -n $KUBE_NAMESPACE -p '{"spec":{"selector":{"version":"blue"}}}'
          kubectl delete deployment github-archiver-green -n $KUBE_NAMESPACE
          
          # Restore database from backup if needed
          if [ "$RESTORE_DB" = "true" ]; then
            LATEST_BACKUP=$(aws s3 ls s3://github-archiver-backups/$(date +%Y%m%d)/ | tail -1 | awk '{print $4}')
            aws s3 cp s3://github-archiver-backups/$(date +%Y%m%d)/$LATEST_BACKUP - | \
              kubectl exec -i -n $KUBE_NAMESPACE statefulset/postgres -- \
              psql -U postgres github_archiver
          fi
