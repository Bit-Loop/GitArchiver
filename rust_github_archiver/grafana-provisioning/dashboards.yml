apiVersion: 1

providers:
  - name: 'GitHub Archiver Dashboards'
    orgId: 1
    folder: 'GitHub Archiver'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
