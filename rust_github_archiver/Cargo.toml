[package]
name = "github_archiver"
version = "2.0.0"
edition = "2021"
description = "Professional GitHub Archive Scraper in Rust"
authors = ["Your Name <isaiah.fpga@gmail.com>"]
default-run = "github_archiver"

[features]
default = []
ai = []
gui = []
db-tests = []
experimental = []

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
tokio-util = "0.7"

# HTTP client and server
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
axum = { version = "0.7", features = ["ws", "multipart", "query"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip", "limit"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"
dotenv = { package = "dotenvy", version = "0.15" }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

# Authentication
jsonwebtoken = "9.2"
argon2 = "0.5"

# System monitoring and metrics
sysinfo = "0.30"
sys-info = "0.9"
prometheus = "0.14"

# Compression
flate2 = "1.0"

# Additional dependencies for YAML support
serde_yaml = "0.9"
uuid = { version = "1.6", features = ["v4", "serde"] }
tempfile = "3.8"

# Security - sensitive data protection
secrecy = { version = "0.8", features = ["serde"] }

# Environment variables
envy = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Lazy initialization
once_cell = "1.19"

# Async utilities
async-trait = "0.1"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Rate limiting
governor = "0.6"

# Regex
regex = "1.10"
url = "2.5"

# BigQuery client for GH Archive scanning
gcp-bigquery-client = "0.28"

# GitHub API client
octocrab = "0.50"

# Redis caching
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Secret scanning
fancy-regex = "0.13"

# Static initialization
lazy_static = "1.4"

# Performance and parallel processing
rayon = "1.8"
lru = "0.18"
rusqlite = { version = "0.32", features = ["bundled"] }
num_cpus = "1.16"

# CSV handling
csv = "1.3"

# Base64 encoding/decoding
base64 = "0.21"

# Additional crypto
sha2 = "0.10"
hex = "0.4"
md5 = "0.7"
hmac = "0.12"

# Additional security
entropy = "0.4"

[dev-dependencies]
tempfile = "3.8"
mockall = "0.12"
proptest = "1.6"
